<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Withering Analytics | LumiLeaf QA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --leaf-green: #2e7d32; --industrial-gray: #455a64; --soft-bg: #f1f8e9; }
        body { background: var(--soft-bg); padding: 30px; font-family: 'Inter', sans-serif; color: var(--industrial-gray); }
        .table-container { background: white; padding: 0; border-radius: 15px; overflow: hidden; border: 1px solid #cfd8dc; }
        .badge-batch { background: var(--industrial-gray); color: white; padding: 6px 12px; border-radius: 6px; font-weight: 700; font-family: 'Courier New', monospace; }
        .time-label { font-size: 0.8rem; color: #78909c; font-weight: 600; }
        .duration-badge { background: #e3f2fd; color: #1565c0; padding: 4px 10px; border-radius: 20px; font-weight: 700; font-size: 0.85rem; border: 1px solid #bbdefb; }
        .duration-alert { background: #fff3e0; color: #ef6c00; border-color: #ffe0b2; }
        .loss-container { padding: 6px 12px; border-radius: 8px; font-weight: 800; display: inline-block; }
        .loss-normal { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
        .loss-warning { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }
        .labor-text { font-size: 0.9rem; color: #546e7a; font-style: italic; }
        .search-bar { border-radius: 12px; border: 1px solid #cfd8dc; padding: 12px 20px; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-1"><i class="fas fa-microscope me-2 text-success"></i> Withering Quality Analysis</h2>
            <p class="text-muted small">Reviewing 12-18h cycle efficiency and labor performance</p>
        </div>
        <a th:href="@{/qa_dashboard}" class="btn btn-outline-secondary px-4 rounded-pill">
            <i class="fas fa-arrow-left me-2"></i> Back to Dashboard
        </a>
    </div>

    <div class="row mb-4">
        <div class="col-md-5">
            <div class="input-group shadow-sm">
                <span class="input-group-text bg-white border-end-0"><i class="fas fa-search text-muted"></i></span>
                <input type="text" id="witheringSearch" class="form-control border-start-0 search-bar"
                       placeholder="Search Batch ID, Labors, or Officers..." onkeyup="filterWitheringTable()">
            </div>
        </div>
    </div>

    <div class="table-container shadow-sm">
        <table class="table table-hover align-middle mb-0" id="witheringTable">
            <thead class="table-light">
            <tr style="height: 60px;">
                <th class="ps-4">Batch Details</th>
                <th>Time (Start - End)</th>
                <th>Duration</th>
                <th>Weights (Fresh/Withered)</th>
                <th>Moisture Loss</th>
                <th>Labor Team</th>
                <th class="text-center">Recorded By</th>
                <th class="text-center">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="record : ${witheringRecords}">
                <td class="ps-4">
                    <span class="badge-batch mb-1" th:text="${record.batchId ?: 'UNKNOWN'}">WTH/10/2</span>
                    <div class="text-muted small" th:text="${record.date ?: 'No Date'}">2026-03-09</div>
                </td>
                <td>
                    <div class="d-flex align-items-center fw-bold">
                        <i class="far fa-clock me-2 text-muted"></i>
                        <span th:text="${record.startTime != null ? record.startTime : '--:--'}"></span>
                        <span class="mx-1 text-muted">-</span>
                        <span th:text="${record.endTime != null ? record.endTime : '--:--'}"></span>
                    </div>
                </td>
                <td>
                    <span th:with="rawTime=${record.timeTaken ?: '0h'},
                                   hasH=${#strings.contains(rawTime, 'h')},
                                   hours=${hasH ? #strings.substringBefore(rawTime, 'h') : '0'}"
                          th:class="${hours != '0' and #conversions.convert(hours, 'Integer') >= 12 and #conversions.convert(hours, 'Integer') <= 18 ? 'duration-badge' : 'duration-badge duration-alert'}"
                          th:text="${record.timeTaken ?: 'N/A'}">
                        16h 00m
                    </span>
                </td>
                <td>
                    <div class="small">
                        <span class="text-success fw-bold">In: </span>
                        <span th:text="${record.intakeWeight != null ? record.intakeWeight + ' kg' : '0.0 kg'}">500kg</span><br>
                        <span class="text-danger fw-bold">Out: </span>
                        <span th:text="${record.witheredWeight != null ? record.witheredWeight + ' kg' : '0.0 kg'}">280kg</span>
                    </div>
                </td>
                <td>
                    <div th:with="before=${record.intakeWeight != null ? record.intakeWeight : 0.0},
                                   after=${record.witheredWeight != null ? record.witheredWeight : 0.0},
                                   loss=${(before > 0) ? ((before - after) / before) * 100 : 0.0}"
                         th:class="${loss >= 45 and loss <= 55 ? 'loss-container loss-normal' : 'loss-container loss-warning'}">
                        <span th:text="${#numbers.formatDecimal(loss, 1, 1) + '%'}">44.0%</span>
                    </div>
                </td>
                <td>
                    <span class="labor-text">
                        <i class="fas fa-users-cog me-1"></i>
                        <span th:text="${record.labors ?: 'Not Assigned'}">Silva, Perera</span>
                    </span>
                </td>
                <td class="text-center">
                    <span class="fw-bold d-block" style="font-size: 0.85rem;" th:text="${record.officerName ?: 'Unknown'}">Kamal Perera</span>
                </td>
                <td class="text-center">
                    <form th:action="@{/qa/withering/recompute-intake}" method="post" style="display:inline">
                        <input type="hidden" name="batchId" th:value="${record.batchId}">
                        <button type="submit" class="btn btn-sm btn-outline-warning">Recompute</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    function filterWitheringTable() {
        const input = document.getElementById("witheringSearch");
        const filter = input.value.toUpperCase();
        const table = document.getElementById("witheringTable");
        const tr = table.getElementsByTagName("tr");
        for (let i = 1; i < tr.length; i++) {
            const textContent = tr[i].textContent || tr[i].innerText;
            if (textContent.toUpperCase().indexOf(filter) > -1) {
                tr[i].style.display = "";
            } else {
                tr[i].style.display = "none";
            }
        }
    }
</script>
</body>
</html>
