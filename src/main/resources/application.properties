server.address=0.0.0.0
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3307/lumileaf_system
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
app.base-url=http://localhost:8080
# FIX: without this, Thymeleaf caches compiled templates and won't pick up .html changes
# without a full app restart (this was likely masking your earlier dashboard fixes).
spring.thymeleaf.cache=false